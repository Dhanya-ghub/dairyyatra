<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dairy Yatra — Experiential Dairy Immersion Across India</title>
    <meta name="description" content="A groundbreaking 15-day travel program bringing together 40 entrepreneurs to explore India's dynamic dairy sector across 5 states." />
    <!-- Fonts inspired by Agri Anubhav (Playfair Display + Cinzel + Cormorant Garamond + DM Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Home page: until the intro video takes over, show its paper colour (no blank flash before it) -->
    <style>
      html.dy-boot, html.dy-boot body { background: #F2EFE7; }
      @media (orientation: portrait) { html.dy-boot, html.dy-boot body { background: #EAE4D1; } }
    </style>
    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, '');
        if (p !== '/programme' && p !== '/programme/fee' && p.indexOf('/admin') !== 0) {
          document.documentElement.classList.add('dy-boot');
        }
      })();
    </script>
  </head>
  <body class="bg-white text-[#14284B] font-sans antialiased selection:bg-[#2B6CB0] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
