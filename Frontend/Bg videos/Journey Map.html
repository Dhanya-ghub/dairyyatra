<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dairy Yatra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#070b10;
    --bg2:#0e1720;
    --cream:#f3e8cf;
    --amber:#f2b134;
    --amber-soft:#e7a33e;
    --amber-bright:#ffd68a;
    --muted:#8ea0ac;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    width:100%; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  #frame{
    position:relative;
    width:min(94vw, 640px);
    aspect-ratio:1/1;
    border-radius:26px;
    background:radial-gradient(circle at 50% 38%, var(--bg2), var(--bg) 72%);
    overflow:hidden;
    isolation:isolate;
  }
  #frame::before{
    content:"";
    position:absolute; inset:0;
    border-radius:26px;
    padding:1px;
    background:linear-gradient(135deg, rgba(242,177,52,.55), rgba(242,177,52,0) 32%, rgba(242,177,52,0) 68%, rgba(242,177,52,.35));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    z-index:5;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  #title{
    position:absolute; top:24px; left:0; right:0; text-align:center;
    font-family:'Fraunces', serif; font-weight:600;
    color:var(--cream); font-size:clamp(20px,4.6vw,29px);
    letter-spacing:.01em;
    opacity:0; transform:translateY(6px);
    transition:opacity 1.1s ease, transform 1.1s ease;
    z-index:4; pointer-events:none;
  }
  #title.show{opacity:1; transform:translateY(0);}
  #subtitle{
    position:absolute; top:60px; left:0; right:0; text-align:center;
    color:var(--muted); font-size:12.5px; letter-spacing:.02em;
    opacity:0; transition:opacity 1.1s ease .15s;
    z-index:4; pointer-events:none;
  }
  #subtitle.show{opacity:1;}

  .label{
    position:absolute; transform:translate(-50%,-100%) scale(.94);
    background:rgba(9,13,18,.94);
    border:1.5px solid rgba(255,214,138,.85);
    color:var(--amber-bright); padding:6px 13px; border-radius:9px;
    font-size:13.5px; font-weight:700; white-space:nowrap;
    pointer-events:none; z-index:6;
    box-shadow:0 0 20px rgba(242,177,52,.4);
    opacity:0; transition:opacity .28s ease, transform .28s ease;
  }
  .label.show{opacity:1; transform:translate(-50%,-112%) scale(1);}
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="c"></canvas>
    <div id="title">Dairy Yatra</div>
    <div id="subtitle">Nine stops across India's dairy belt</div>

  </div>
</div>

    const y2 = y*Math.cos(t) - z*Math.sin(t);

  const INDIA_CENTER_LAT = 21.5;
  const T1_END = 1500;        // free rotation
  const SETTLE = 650;         // ease to India-facing
  const ZOOM_DELAY = 120;
  const ZOOM_DUR = 950;
  const ZOOM_START = T1_END + SETTLE + ZOOM_DELAY;
  const ZOOM_END = ZOOM_START + ZOOM_DUR;
  const SHOWCASE_GAP = 120;
  const SHOWCASE_HOLD = 620;
  const SHOWCASE_START = ZOOM_END + 350;

  let startTime = performance.now();
  let activeIndex = -1;
  let showcaseTimer = null;
  let rafId = null;
  const LOOP_PAUSE = 1400; // pause after showcase before the whole sequence restarts

  function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  function cityScreenPos(i){
    const c = cities[i];
    const fit = indiaFit || { scale:1, offsetX:0, offsetY:0 };
    return [fit.offsetX + c.nx*fit.scale, fit.offsetY + c.ny*fit.scale];
  }

  function positionLabel(i){
    if(i < 0){ label.classList.remove('show'); return; }
    const [x,y] = cityScreenPos(i);
    label.style.left = x + 'px';
    label.style.top = y + 'px';
    label.textContent = cities[i].name;
    label.classList.add('show');
  }

  function scheduleShowcase(){
    let i = 0;
    function step(){
      activeIndex = i;
      positionLabel(i);
      i++;
      if(i < cities.length){
        showcaseTimer = setTimeout(step, SHOWCASE_HOLD + SHOWCASE_GAP);
      } else {
        showcaseTimer = setTimeout(()=>{
          activeIndex = -1;
          positionLabel(-1);
          showcaseTimer = setTimeout(restartLoop, LOOP_PAUSE);
        }, SHOWCASE_HOLD);
      }
    }
    showcaseTimer = setTimeout(step, SHOWCASE_START - (performance.now()-startTime));
  }

  function restartLoop(){
    activeIndex = -1;
    positionLabel(-1);
    titleEl.classList.remove('show');
    subtitleEl.classList.remove('show');
    startTime = performance.now();
    setTimeout(()=>titleEl.classList.add('show'), 250);
    setTimeout(()=>subtitleEl.classList.add('show'), 500);
    scheduleShowcase();
  }

  function render(now){
    const t = now - startTime;
    ctx.clearRect(0,0,W,H);

    // rotation longitude
    let rotLon;
    const baseSpeed = 34; // deg/sec
    if(t < T1_END){
      rotLon = (t/1000)*baseSpeed;
    } else if(t < T1_END+SETTLE){
      const at1 = (T1_END/1000)*baseSpeed;
      const targetRot = INDIA_CENTER_LON;
      // shortest path adjust
      let diff = ((targetRot - (at1%360)) + 540) % 360 - 180;
      const p = easeInOutCubic(clamp01((t-T1_END)/SETTLE));
      rotLon = at1 + diff*p;
    } else {
      rotLon = INDIA_CENTER_LON;
    }

    // globe alpha & scale
    let globeAlpha = 1, globeScale = 1;
    if(t >= ZOOM_START){
      const p = easeInOutCubic(clamp01((t-ZOOM_START)/ZOOM_DUR));
      globeScale = 1 + p*6.5;
      globeAlpha = 1 - clamp01(p/0.75);
    }
    // india alpha
    let indiaAlpha = 0;
    if(t >= ZOOM_START + ZOOM_DUR*0.25){
      const p = clamp01((t-(ZOOM_START+ZOOM_DUR*0.25))/(ZOOM_DUR*0.75));
      indiaAlpha = easeInOutCubic(p);
    }

    const R = Math.min(W,H)*0.30;
    const cx = W/2, cy = H*0.52;
    const tilt = 14;

    // ---- draw globe ----
    if(globeAlpha > 0.003){
      ctx.save();
      ctx.globalAlpha = globeAlpha;
      // sphere body
      const grad = ctx.createRadialGradient(cx-R*0.3, cy-R*0.35, R*0.1, cx, cy, R*1.05);
      grad.addColorStop(0, '#16232e');
      grad.addColorStop(1, '#070b10');
      ctx.beginPath();
      const sx = cx, sy = cy;
      ctx.translate(sx, sy);
      ctx.scale(globeScale, globeScale);
      ctx.translate(-sx, -sy);
      ctx.fillStyle = grad;
      ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.fill();

      // faint outline ring
      ctx.strokeStyle = 'rgba(242,177,52,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.stroke();

      // continent dots
      ctx.fillStyle = 'rgba(200,214,220,0.55)';
      for(const grid of worldGrids){
        for(const [la,lo] of grid){
          const p = sphereProject(la, lo, rotLon, R, cx, cy, tilt);
          if(p.z > 0.03){
            const a = Math.min(1, p.z*1.3);
            ctx.globalAlpha = globeAlpha*a;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.1, 0, Math.PI*2);
            ctx.fill();
          }
        }
      }

      // India hotspot pin (fades in once settled)
      if(t >= T1_END){
        const settleP = clamp01((t-T1_END)/SETTLE);
        const pinAlpha = settleP;
        const p = sphereProject(INDIA_CENTER_LAT, INDIA_CENTER_LON, rotLon, R, cx, cy, tilt);
        if(p.z > 0.03){
          const pulse = (t % 1400) / 1400;
          ctx.globalAlpha = globeAlpha * pinAlpha;
          ctx.strokeStyle = 'rgba(242,177,52,0.65)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4 + pulse*10, 0, Math.PI*2);
          ctx.globalAlpha = globeAlpha * pinAlpha * (1-pulse);
          ctx.stroke();
          ctx.globalAlpha = globeAlpha * pinAlpha;
          ctx.fillStyle = '#f2b134';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3.4, 0, Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ---- draw india ----
    if(indiaAlpha > 0.003 && indiaImgReady){
      drawIndiaLand(indiaAlpha);

      // connecting route path, drawn once the map has mostly faded in
      const pathP = clamp01((indiaAlpha-0.55)/0.45);
      if(pathP > 0.001){
        ctx.save();
        ctx.globalAlpha = pathP * 0.85;
        ctx.strokeStyle = 'rgba(242,177,52,0.75)';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([2, 5]);
        ctx.beginPath();
        ROUTE_ORDER.forEach((name, idx) => {
          const ci = cityIndexByName[name];
          const [rx, ry] = cityScreenPos(ci);
          if(idx === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
        });
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      // city markers
      for(let i=0;i<cities.length;i++){
        const [x,y] = cityScreenPos(i);
        const isActive = i === activeIndex;
        const pulse = ((t + i*180) % 1800) / 1800;
        ctx.save();
        ctx.globalAlpha = indiaAlpha;

        // ambient pulse ring
        ctx.strokeStyle = isActive ? 'rgba(255,214,138,0.85)' : 'rgba(242,177,52,0.5)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(x, y, 4.5 + pulse*(isActive?13:9), 0, Math.PI*2);
        ctx.globalAlpha = indiaAlpha * (1-pulse) * (isActive?0.95:0.65);
        ctx.stroke();

        // outer ring for contrast
        ctx.globalAlpha = indiaAlpha;
        ctx.strokeStyle = 'rgba(9,13,18,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, isActive ? 6.6 : 5.0, 0, Math.PI*2);
        ctx.stroke();

        // core dot
        ctx.fillStyle = isActive ? '#ffd68a' : '#f2b134';
        ctx.beginPath();
        ctx.arc(x, y, isActive ? 6.2 : 4.6, 0, Math.PI*2);
        ctx.fill();

        ctx.shadowColor = 'rgba(242,177,52,0.95)';
        ctx.shadowBlur = isActive ? 18 : 8;
        ctx.beginPath();
        ctx.arc(x, y, isActive ? 6.2 : 4.6, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      if(activeIndex >= 0) positionLabel(activeIndex);
    }

    rafId = requestAnimationFrame(render);
  }


  // -------------- Boot --------------
  window.addEventListener('resize', resize);
  resize();
  setTimeout(()=>titleEl.classList.add('show'), 250);
  setTimeout(()=>subtitleEl.classList.add('show'), 500);
  scheduleShowcase();
  rafId = requestAnimationFrame(render);
})();
</script>
</body>
</html>
