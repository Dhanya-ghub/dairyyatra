name: dairyyatra                         # fixed project name, so container names don't depend on the folder name

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dairy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dairy
      TZ: Asia/Kolkata                    # database clock and logs in India time
    ports:
      - "127.0.0.1:5432:5432"            # this machine only; remove this line if you never run the backend outside Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs once, only when the database is first created
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairy -d dairy"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      TZ: Asia/Kolkata                    # show dates to applicants and admins in India time
      DATABASE_URL: postgres://dairy:${POSTGRES_PASSWORD}@db:5432/dairy
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # no "ports": only the frontend container talks to it

  frontend:
    build: ./Frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"             # the only public entry point

  adminer:                                # local use only: delete this service on the live server
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
