              <div className="lg:col-span-5 bg-white text-[#281e18] rounded-3xl p-6 sm:p-8 shadow-2xl">
                <div className="flex items-center justify-between mb-3">
                  <span className="px-3 py-1 bg-brand-forest/10 text-brand-forest text-xs font-bold uppercase rounded-full">{currentStop.day}</span>
                  <span className="text-xs font-bold text-brand-terracotta bg-brand-terracotta/10 px-3 py-1 rounded-full">{currentStop.modeToNext} Transport</span>
                </div>
                <h3 className="font-serif text-3xl sm:text-4xl font-bold text-brand-dark mb-1">{currentStop.city}</h3>
                <p className="text-xs font-bold text-brand-terracotta mb-4">📍 {currentStop.state} — {currentStop.title}</p>
                
                <div className="rounded-2xl overflow-hidden aspect-video mb-4 shadow-md">
                  <img src={currentStop.heroImage} alt={currentStop.city} className="w-full h-full object-cover" />
                </div>

                <p className="text-xs sm:text-sm text-brand-textMuted leading-relaxed mb-4">{currentStop.description}</p>
                
                <div className="bg-brand-cream rounded-xl p-3.5 mb-4 border border-brand-border/40">
                  <span className="text-[10px] uppercase font-bold text-brand-olive block">Host Institution / Focus</span>
                  <span className="font-serif text-base font-bold text-brand-dark">{currentStop.institution}</span>
                </div>

                <div className="space-y-1.5 text-xs text-brand-textMuted">
                  {currentStop.learnings.map((l, i) => (
                    <div key={i} className="flex items-start gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-brand-terracotta mt-1 shrink-0"></span>
                      <span>{l}</span>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>
        </section>

        {/* APPLICATION MODAL */}
        {isApplyOpen && (
          <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative border border-brand-border">
              <button onClick={() => setIsApplyOpen(false)} className="absolute top-4 right-4 text-gray-500 font-bold hover:text-black">✕</button>
              <div className="flex items-center gap-3 mb-4">
                <img src="/logo.jpeg" alt="Logo" className="h-10 w-auto rounded-lg bg-white p-1" />
                <h3 className="font-serif text-3xl font-bold text-brand-dark">Expression of Interest</h3>
              </div>
              <p className="text-xs text-brand-textMuted mb-6">Submitting your details opens your default email client to send to <strong>apply@dairyyatra.in</strong>.</p>
              
              <form onSubmit={(e) => { e.preventDefault(); window.location.href = `mailto:apply@dairyyatra.in?subject=Dairy Yatra Application`; setIsApplyOpen(false); }} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-brand-olive mb-1">Full Name</label>
                  <input required type="text" placeholder="Ramesh Kumar" className="w-full border p-2.5 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-brand-olive mb-1">Email Address</label>
                  <input required type="email" placeholder="ramesh@example.com" className="w-full border p-2.5 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-brand-olive mb-1">Statement of Interest</label>
                  <textarea required rows="3" placeholder="Tell us about your background..." className="w-full border p-2.5 rounded-xl text-sm"></textarea>
                </div>
                <button type="submit" className="w-full bg-brand-terracotta text-white font-bold py-3 rounded-xl shadow-lg">Submit Application via Email →</button>
              </form>
            </div>
          </div>
        )}

        {/* FOOTER */}
        <footer className="bg-brand-dark text-white py-12 border-t border-white/10 text-center text-xs">
          <div className="flex items-center justify-center gap-2 mb-3">
            <img src="/logo.jpeg" alt="Logo" className="h-9 w-auto rounded bg-white p-1" />
            <span className="font-serif text-xl font-bold">Dairy Yatra</span>
          </div>
          <p>© Dairy Yatra Initiative across Tamil Nadu, Karnataka, Maharashtra, Gujarat, and Rajasthan.</p>
        </footer>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
